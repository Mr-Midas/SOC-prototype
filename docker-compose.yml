# Arbiterion â€” full stack: FastAPI app + Celery worker + PostgreSQL 16 + Redis 7
# Start with: docker compose up -d
# The schema.sql is mounted into postgres init so tables are created on first boot.

services:
  # FastAPI web server (uvicorn with --reload for development)
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    command: uvicorn arbiterion.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery worker â€” runs the alert pipeline and action queue consumer
  worker:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    command: celery -A arbiterion.worker.celery_app worker --loglevel=info --concurrency=4

  # PostgreSQL 16 â€” schema auto-loaded via docker-entrypoint-initdb.d
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: arbiterion
      POSTGRES_PASSWORD: arbiterion
      POSTGRES_DB: arbiterion
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbiterion -d arbiterion"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./arbiterion/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  # Redis 7 â€” message broker for Celery (task queue + result backend)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

